openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gemini
    description: Free-tier Gemini reply generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gemini/generate-replies:
    post:
      operationId: generateGeminiReplies
      tags: [gemini]
      summary: Generate three reply suggestions
      description: Generates compact reply suggestions through the server-side Gemini Free Tier route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRepliesInput"
      responses:
        "200":
          description: Three reply suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateRepliesResponse"
        "429":
          description: Free-tier quota is temporarily exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Gemini response unavailable or malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PersonalityInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 500
        warmth:
          type: integer
          minimum: 0
          maximum: 100
        humor:
          type: integer
          minimum: 0
          maximum: 100
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        directness:
          type: integer
          minimum: 0
          maximum: 100
        playfulness:
          type: integer
          minimum: 0
          maximum: 100
        responseLength:
          type: string
          maxLength: 40
        preferredWords:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 60
        blockedWords:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 60
      required:
        - name
        - description
        - warmth
        - humor
        - confidence
        - directness
        - playfulness
        - responseLength
        - preferredWords
        - blockedWords
    GenerateRepliesInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
        avakinUsername:
          type: string
          maxLength: 64
        focusedPlayer:
          type: string
          maxLength: 64
        globalSummary:
          type: string
          maxLength: 2500
        playerSummary:
          type: string
          maxLength: 2500
        recentMessages:
          type: array
          items:
            $ref: "#/components/schemas/ChatContextMessage"
          maxItems: 30
        newMessages:
          type: array
          items:
            $ref: "#/components/schemas/ChatContextMessage"
          maxItems: 8
        dialect:
          type: string
          maxLength: 40
        dialectStrength:
          type: integer
          minimum: 0
          maximum: 100
        mode:
          type: string
          enum: [quick, calm]
        personality:
          $ref: "#/components/schemas/PersonalityInput"
      required:
        - message
        - avakinUsername
        - focusedPlayer
        - globalSummary
        - playerSummary
        - recentMessages
        - newMessages
        - dialect
        - dialectStrength
        - mode
        - personality
    ChatContextMessage:
      type: object
      properties:
        order:
          type: integer
        speaker:
          type: string
          maxLength: 64
        text:
          type: string
          minLength: 1
          maxLength: 1000
        timestamp:
          type: string
          maxLength: 64
        isMine:
          type: boolean
        directedAtMe:
          type: boolean
        mentionsMe:
          type: boolean
        focusedPlayer:
          type: boolean
      required:
        - order
        - speaker
        - text
        - timestamp
        - isMine
        - directedAtMe
        - mentionsMe
        - focusedPlayer
    ReplySuggestion:
      type: object
      properties:
        text:
          type: string
        style:
          type: string
          enum: [متوازن, مباشر, خفيف]
      required:
        - text
        - style
    GenerateRepliesResponse:
      type: object
      properties:
        suggestions:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/ReplySuggestion"
      required:
        - suggestions
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

